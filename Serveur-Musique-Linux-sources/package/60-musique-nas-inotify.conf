# Musique NAS watches every album folder with inotify, so that new albums are
# found without walking the disk. A large library exceeds the default limit
# of some kernels. Installed only when the current limit is lower.
# Musique NAS surveille chaque dossier d'album avec inotify, pour trouver les
# nouveaux albums sans parcourir le disque. Une grande bibliothèque dépasse
# la limite par défaut de certains noyaux. Installé seulement si la limite
# actuelle est plus basse.
fs.inotify.max_user_watches = 262144
